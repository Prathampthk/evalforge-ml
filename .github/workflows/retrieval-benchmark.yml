name: EvalForge public retrieval benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 1 * *"

permissions:
  contents: read

concurrency:
  group: retrieval-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-experiments.txt
      - run: python -m pip install -r requirements-experiments.txt
      - run: python -m evaluation.prepare_dataset --output data/scifact
      - run: python -m evaluation.prepare_model
      - run: >
          python -m evaluation.experiment
          --config configs/experiments/scifact.json
          --output reports/retrieval/scifact
      - run: >
          python -m evaluation.compare
          --report reports/retrieval/scifact/report.json
          --output reports/retrieval/scifact/comparison.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scifact-retrieval-experiment
          path: reports/retrieval/scifact/
          retention-days: 14
